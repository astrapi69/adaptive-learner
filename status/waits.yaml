# What each open issue of the ecosystem waits for (#3889).
#
# One entry per open issue in a repository of status/repos.yaml, keyed repo#N.
# Read by scripts/status_board.py into BOARD.md and STATUS.md; `make status-check`
# fails when an open issue has no entry, an entry belongs to a closed issue, or an
# issue moved after `checked` (check the classification again).
#
#   summary     the title as half a sentence
#   waits       decision (an answer from the owner), external (a device, a key, an
#               upstream release, a waiting period), issue (needs blocked_by), nothing
#   detail      one sentence: what exactly it waits for, or why nothing
#   evidence    link to the comment or place in the issue that shows it
#   checked     the day the classification was last checked
#   blocked_by  [repo#N, ...], only with waits: issue
#   needed_by   optional, shown in STATUS.md 'Waiting for you'

