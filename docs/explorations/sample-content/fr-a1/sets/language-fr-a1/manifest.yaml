# French A1 set manifest (Phase 43 / EXP-002 / D-106).
#
# The Content-Loader fetches this once per download to learn
# the lesson filename list (``metadata.lessons``). Adding a
# new lesson is a two-line PR: add the JSON file under
# ``lessons/`` and append its filename here.
schema_version: '1.0'
name: French A1 (Beginner)
description: >-
  Two-lesson pilot covering greetings + numbers 1-10. Each
  lesson mixes theory (Markdown) with exercises so the
  learner sees varied stimuli within a single 5-15 minute
  session.
sets:
  - id: language-fr-a1
    title: French A1 (Beginner)
    language: fr
    level: A1
    version: '1.0.0'
    lesson_count: 2
    domain: language
    description: >-
      Roughly 20 minutes of total content. Bumps to v1.0.1
      whenever any lesson changes.
    tags:
      - beginner
      - travel
metadata:
  author: Asterios Raptis
  license: CC-BY-SA-4.0
  # The Content-Loader's set-manifest parser reads this list
  # (commit 6 / service.py::_lesson_filenames_for_set). When
  # absent the loader falls back to ``01.json``..``NN.json``
  # by convention.
  lessons:
    - 01-greetings.json
    - 02-numbers.json
