<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- The .ico fallback is the FIRST tag on purpose: browsers
         that hit /favicon.ico directly (tab restore, bookmarks,
         many crawlers) ignore the <link> tag below entirely.
         The PNG variants give crisp tab icons on modern browsers. -->
    <link rel="icon" href="/favicon.ico" sizes="any"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
    <meta name="theme-color" content="#0d9488"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
    <title>Adaptive Learner</title>
    <!-- Social preview (Open Graph + Twitter). Absolute URLs point at
         the canonical public deployment, which is what crawlers fetch. -->
    <meta property="og:type" content="website"/>
    <meta property="og:title" content="Adaptive Learner"/>
    <meta property="og:description" content="Adaptive learning system based on the six-method learning model."/>
    <meta property="og:image" content="https://astrapi69.github.io/adaptive-learner/og-image.png"/>
    <meta property="og:url" content="https://astrapi69.github.io/adaptive-learner/"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="Adaptive Learner"/>
    <meta name="twitter:description" content="Adaptive learning system based on the six-method learning model."/>
    <meta name="twitter:image" content="https://astrapi69.github.io/adaptive-learner/og-image.png"/>
    <!-- Fonts are bundled locally in public/fonts/ (no CDN dependency) -->
    <!-- Phase 58E: apply the saved theme BEFORE first paint to avoid a
         flash of the wrong theme. Mirrors the resolution in
         src/hooks/useTheme.ts (dotted key + legacy migration + auto). -->
    <script>
      (function () {
        try {
          var valid = ["light", "dark", "ocean", "forest", "high-contrast", "sepia"];
          var choice = localStorage.getItem("adaptive-learner.theme");
          if (choice === null) {
            var legacy = localStorage.getItem("adaptive-learner-theme");
            if (legacy === "light" || legacy === "dark") choice = legacy;
          }
          var resolved =
            choice && valid.indexOf(choice) !== -1
              ? choice
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          /* localStorage blocked -> fall through to the default light theme */
        }
      })();
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
