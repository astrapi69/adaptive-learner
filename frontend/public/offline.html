<!DOCTYPE html>
<!--
  Phase 9B — offline fallback page. Served by the service worker
  when a navigation request fails AND no cached entry is
  available. Inline-styled so it renders without any network
  dependencies whatsoever (no external CSS, no JS bundle, no
  fonts). Theme color matches the manifest so the install icon
  + this fallback feel like the same app.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Adaptive Learner</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="theme-color" content="#6366f1">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
            color: #1f2937;
        }
        @media (prefers-color-scheme: dark) {
            html, body {
                background: #0f1115;
                color: #e6e6e6;
            }
        }
        main {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
            box-sizing: border-box;
        }
        .icon {
            width: 96px;
            height: 96px;
            border-radius: 16px;
            background: #6366f1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            color: #ffffff;
            font-size: 2.5rem;
        }
        h1 {
            margin: 0 0 0.75rem 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        p {
            margin: 0 0 0.75rem 0;
            line-height: 1.5;
            max-width: 28rem;
            color: #4b5563;
        }
        @media (prefers-color-scheme: dark) {
            p {
                color: #a1a1aa;
            }
        }
        button {
            margin-top: 1.5rem;
            background: #6366f1;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            min-height: 44px;
            min-width: 44px;
        }
        button:hover {
            background: #4f46e5;
        }
    </style>
</head>
<body>
<main data-testid="offline-page">
    <div class="icon" aria-hidden="true">⇄</div>
    <h1>You're offline</h1>
    <p>
        Your progress is saved.
        Connect to continue learning.
    </p>
    <p>
        New chat sessions need an AI provider, which needs network.
        Past sessions and your profile stay readable once cached.
    </p>
    <button type="button" onclick="window.location.reload()">
        Try again
    </button>
</main>
</body>
</html>
