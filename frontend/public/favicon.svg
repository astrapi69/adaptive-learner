<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Adaptive Learner">
  <!-- Indigo rounded-square ground; matches the app's primary token
       (the accent CSS variable, #6366f1) and the project plan's
       ai_adaptive method colour. -->
  <rect width="32" height="32" rx="6" fill="#6366f1"/>
  <!-- Edges first so the nodes paint on top. 4-node diamond +
       cross-connections + hub-spokes. -->
  <g stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" fill="none">
    <line x1="16" y1="7"  x2="7"  y2="16" opacity="0.85"/>
    <line x1="16" y1="7"  x2="25" y2="16" opacity="0.85"/>
    <line x1="7"  y1="16" x2="16" y2="25" opacity="0.85"/>
    <line x1="25" y1="16" x2="16" y2="25" opacity="0.85"/>
    <line x1="16" y1="7"  x2="16" y2="25" opacity="0.55"/>
    <line x1="7"  y1="16" x2="25" y2="16" opacity="0.55"/>
  </g>
  <g fill="#ffffff">
    <circle cx="16" cy="7"  r="2.4"/>
    <circle cx="7"  cy="16" r="2.4"/>
    <circle cx="25" cy="16" r="2.4"/>
    <circle cx="16" cy="25" r="2.4"/>
    <!-- Hub: slightly larger; suggests the learner / orchestrator
         that the four method nodes adapt around. -->
    <circle cx="16" cy="16" r="3.1"/>
  </g>
</svg>
