server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Global request-body limit. nginx defaults to 1M, which 413s any larger
    # upload - backup (.alb) import, content set-downloads, and any other
    # sizable request. 50M covers every realistic payload (#994).
    client_max_body_size 50M;

    # API calls go to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
