[tool.poetry]
name = "adaptive-learner-launcher"
version = "2.10.0"
description = "Windows Simple Launcher for AdaptiveLearner. Starts the Docker stack, opens the browser, stops the stack on exit."
authors = ["Asterios Raptis"]
license = "MIT"
package-mode = true
packages = [{include = "adaptive_learner_launcher"}]

[tool.poetry.dependencies]
# The launcher is stdlib-only and runs from source on the user's system
# Python; real devices already run it on CPython 3.14 (the runtime that
# surfaced #948). Keep the upper bound one minor ahead of the highest
# tested runtime. PyInstaller 6.x builds on 3.11-3.14.
python = ">=3.11,<3.15"
# stdlib-only runtime: tkinter, urllib, webbrowser, subprocess, pathlib, json, logging
# Tkinter ships with Python on Windows installers; no pip dep required.
platformdirs = "^4.9.6"
# OPTIONAL system-tray support (minimize-to-tray, #987). Installed only via
# the `tray` extra: `pip install adaptive-learner-launcher[tray]`. Without
# them the launcher falls back to a plain window close - no crash.
pystray = {version = ">=0.19.4,<0.20.0", optional = true}
pillow = {version = "^12.2.0", optional = true}
# NO `extras = ["tray"]` here, deliberately: the FROZEN artifact excludes
# pystray/Pillow (see the .spec) to keep the download small - every learner
# pays those bytes - and on GNOME a docked icon would additionally need a
# shell extension, so the promise would be conditional. Declaring an extra
# the artifact throws out is one statement too many; this is the one that
# goes. The tray stays available to SOURCE installs via the `tray` extra
# above. Requires >= 0.25.2: from that version the X CLOSES the launcher
# when no tray can dock (before it minimized forever and only the task
# manager could end it - docker-app-launcher#108).
docker-app-launcher = "^0.28.0"

[tool.poetry.extras]
tray = ["pystray", "pillow"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pyinstaller = "^6.11.0"
pillow = "^12.2.0"  # Used only by the icon-generation script; bumped from 11.x for CVE-2026-{25990,40192,42308,42309,42310,42311}

[tool.poetry.scripts]
adaptive-learner-launcher = "adaptive_learner_launcher.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
