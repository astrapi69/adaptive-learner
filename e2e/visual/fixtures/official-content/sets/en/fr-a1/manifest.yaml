# French A1 (for English speakers) - set manifest
# (Phase 60 / v1.44.0; lessons authored in Phase 51 / v1.34.0).
#
# The Content-Loader fetches this once per download to learn the
# lesson filename list (``metadata.lessons``). Adding a lesson is
# a two-line PR: add the JSON under ``lessons/`` and append its
# filename here, then bump ``lesson_count`` in the root manifest.
#
# v1.4.0: pronunciation lesson (ext:al-speak-and-record, engine#68
# idea 3), mirroring the de-source trilogy
# (adaptive-learner-content#192/#194/#198). Builds on lessons 1, 5, 8,
# 9 without changing them: the same sentences, said aloud instead of
# recognized. No NN-prefix - display order (lexicographic by
# lesson.id) puts it at the end, after lesson 15.
schema_version: '1.2'
name: French A1 (for English speakers)
description: >-
  Sixteen-lesson A1-level French course explained in English:
  greetings, numbers, articles, être + avoir, self-
  introduction, family, colors + clothing, restaurant,
  directions, the passé composé (with avoir and être), telling
  time + daily routine, food shopping, and the futur proche,
  closing with an A1 review and a pronunciation lesson.
sets:
  - id: fr-a1-from-en
    title: French A1 (for English speakers)
    title_native: Français A1
    target_language: fr
    source_language: en
    level: A1
    path: sets/en/fr-a1
    version: '1.4.0'
    lesson_count: 16
    domain: language
    tags:
      - beginner
      - travel
      - everyday
metadata:
  author: Asterios Raptis
  license: CC-BY-SA-4.0
  lessons:
    - 01-greetings.json
    - 02-numbers.json
    - 03-articles.json
    - 04-etre-avoir.json
    - 05-se-presenter.json
    - 06-famille.json
    - 07-couleurs-vetements.json
    - 08-au-restaurant.json
    - 09-directions.json
    - 10-passe-compose.json
    - 11-heure-routine.json
    - 12-courses-nourriture.json
    - 13-passe-compose-etre.json
    - 14-futur-proche.json
    - 15-revision.json
    - pronunciation-everyday-sentences.json
