services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Internal backend port. Matches the dev value so curl + healthcheck
    # don't have to special-case prod. Override with ADAPTIVE_LEARNER_PORT
    # at compose-up time when colocating with another service that
    # already binds 18001 inside its own network.
    command: sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${ADAPTIVE_LEARNER_PORT:-18001} --workers 2'
    volumes:
      - adaptive-learner-data:/app/data
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - ADAPTIVE_LEARNER_DEBUG=false
      # Single canonical data dir. DB lives at $DATA_DIR/adaptive_learner.db
      # and uploads at $DATA_DIR/uploads/, both inside the named
      # volume so they survive container rebuilds. The volume mount
      # at /app/data is the persistence boundary.
      - ADAPTIVE_LEARNER_DATA_DIR=/app/data
      - ADAPTIVE_LEARNER_PORT=${ADAPTIVE_LEARNER_PORT:-18001}
      - ADAPTIVE_LEARNER_CORS_ORIGINS=${ADAPTIVE_LEARNER_CORS_ORIGINS:-http://localhost:${ADAPTIVE_LEARNER_PUBLIC_PORT:-7880}}
      - ADAPTIVE_LEARNER_SECRET_KEY=${ADAPTIVE_LEARNER_SECRET_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen(f'http://localhost:{os.environ.get(\\\"ADAPTIVE_LEARNER_PORT\\\", \\\"18001\\\")}/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    # Host-published port for the nginx-served static build.
    # ``ADAPTIVE_LEARNER_PUBLIC_PORT`` is distinct from
    # ``ADAPTIVE_LEARNER_PORT`` (the BACKEND port) — they're not
    # interchangeable, and reusing one name for both was the source
    # of the v0.0.0 confusion.
    ports:
      - "${ADAPTIVE_LEARNER_PUBLIC_PORT:-7880}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  adaptive-learner-data:
