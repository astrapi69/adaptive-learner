[tool.poetry]
name = "adaptive-learner-plugin-content-loader"
version = "2.10.0"
description = "Adaptive Learner: Content-Loader — downloads and caches structured lesson sets from public content repos (Phase 43 / EXP-002). Works in API mode and Dexie / GitHub-Pages mode."
authors = ["Asterios Raptis"]
license = "MIT"
packages = [{include = "adaptive_learner_content_loader"}]

[tool.poetry.dependencies]
python = "^3.11"
pluginforge = "^0.10.0"
fastapi = "^0.136.0"
pydantic = "^2.13.0"
httpx = "^0.28.0"
pyyaml = "^6.0.2"

[tool.poetry.plugins."adaptive_learner.plugins"]
content-loader = "adaptive_learner_content_loader.plugin:ContentLoaderPlugin"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-asyncio = "^1.2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
