[tool.poetry]
name = "adaptive-learner-plugin-session"
version = "1.23.1"
description = "Adaptive Learner: 7-step learning cycle, per-method system prompts, stagnation-based method switching."
authors = ["Asterios Raptis"]
license = "MIT"
packages = [{include = "adaptive_learner_session"}]

[tool.poetry.dependencies]
python = "^3.11"
pluginforge = "^0.10.0"
fastapi = "^0.136.0"
pydantic = "^2.13.0"
sqlalchemy = "^2.0.49"

[tool.poetry.plugins."adaptive_learner.plugins"]
session = "adaptive_learner_session.plugin:SessionPlugin"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
