[tool.poetry]
name = "adaptive-learner-plugin-ai-anthropic"
version = "2.8.2"
description = "Adaptive Learner: Anthropic Claude provider for the ai_complete hook."
authors = ["Asterios Raptis"]
license = "MIT"
packages = [{include = "adaptive_learner_ai_anthropic"}]

[tool.poetry.dependencies]
python = "^3.11"
pluginforge = "^0.10.0"
# anthropic 0.55 ships the messages.create API the plugin relies on.
# Pinned with a caret so a future-incompatible 0.60 doesn't sneak in;
# bump the lower bound when the project tests a newer release.
anthropic = "^0.55.0"

[tool.poetry.plugins."adaptive_learner.plugins"]
ai-anthropic = "adaptive_learner_ai_anthropic.plugin:AiAnthropicPlugin"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
