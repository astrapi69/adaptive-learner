[tool.poetry]
name = "adaptive-learner-plugin-ai-anthropic"
version = "2.13.0"
description = "Adaptive Learner: Anthropic Claude provider for the ai_complete hook."
authors = ["Asterios Raptis"]
license = "MIT"
packages = [{include = "adaptive_learner_ai_anthropic"}]

[tool.poetry.dependencies]
python = "^3.11"
pluginforge = "^0.10.0"
# anthropic 0.122: the plugin's whole surface (messages.create,
# messages.stream + text_stream, Anthropic/AsyncAnthropic constructors,
# native exception classes) verified against the 0.55->0.122 changelog:
# no breaking change touches it (#2650). Caret-pinned so an
# incompatible future 0.x doesn't sneak in; bump the lower bound only
# with a fresh changelog review + live-call proof.
anthropic = "^0.122.0"

[tool.poetry.plugins."adaptive_learner.plugins"]
ai-anthropic = "adaptive_learner_ai_anthropic.plugin:AiAnthropicPlugin"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
