[tool.poetry]
name = "adaptive-learner-plugin-ai-perplexity"
version = "2.11.0"
description = "Adaptive Learner: Perplexity sonar provider for the ai_complete hook (OpenAI-compatible)."
authors = ["Asterios Raptis"]
license = "MIT"
packages = [{include = "adaptive_learner_ai_perplexity"}]

[tool.poetry.dependencies]
python = "^3.11"
pluginforge = "^0.10.0"
# Perplexity speaks the OpenAI-compatible chat-completions wire
# format; the OpenAI SDK with a base_url override is the client.
# Same pin rationale as the ai-openai plugin.
openai = "^2.0.0"

[tool.poetry.plugins."adaptive_learner.plugins"]
ai-perplexity = "adaptive_learner_ai_perplexity.plugin:AiPerplexityPlugin"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
