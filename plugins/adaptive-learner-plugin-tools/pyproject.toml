[tool.poetry]
name = "adaptive-learner-plugin-tools"
version = "1.70.1"
description = "Adaptive Learner: static external-tool recommendations tailored to the learner's profile."
authors = ["Asterios Raptis"]
license = "MIT"
packages = [{include = "adaptive_learner_tools"}]

[tool.poetry.dependencies]
python = "^3.11"
pluginforge = "^0.10.0"
fastapi = "^0.136.0"
pydantic = "^2.13.0"
sqlalchemy = "^2.0.49"

[tool.poetry.plugins."adaptive_learner.plugins"]
tools = "adaptive_learner_tools.plugin:ToolsPlugin"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
