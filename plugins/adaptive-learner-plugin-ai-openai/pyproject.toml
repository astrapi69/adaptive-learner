[tool.poetry]
name = "adaptive-learner-plugin-ai-openai"
version = "1.70.0"
description = "Adaptive Learner: OpenAI GPT provider for the ai_complete hook."
authors = ["Asterios Raptis"]
license = "MIT"
packages = [{include = "adaptive_learner_ai_openai"}]

[tool.poetry.dependencies]
python = "^3.11"
pluginforge = "^0.10.0"
# openai 2.x ships the chat.completions.create API the plugin
# relies on. Pinned with a caret so a future-incompatible 3.x
# doesn't sneak in; bump when the project tests a newer major.
openai = "^2.0.0"

[tool.poetry.plugins."adaptive_learner.plugins"]
ai-openai = "adaptive_learner_ai_openai.plugin:AiOpenAiPlugin"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
