[tool.poetry]
name = "adaptive-learner-plugin-missions"
version = "1.78.0"
description = "Adaptive Learner: daily missions (EXP-010) - deterministic per-user/per-day goals evaluated against existing learning data."
authors = ["Asterios Raptis"]
license = "MIT"
packages = [{include = "adaptive_learner_missions"}]

[tool.poetry.dependencies]
python = "^3.11"
pluginforge = "^0.10.0"
fastapi = "^0.136.0"
pydantic = "^2.13.0"
sqlalchemy = "^2.0.49"
pyyaml = "^6.0"

[tool.poetry.plugins."adaptive_learner.plugins"]
missions = "adaptive_learner_missions.plugin:MissionsPlugin"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
