# Mission catalog (EXP-010 / Phase 56 / D-126).
#
# Static, deterministic daily-mission templates. The generator
# (56C) picks 3 per day per user, seeded by user_id + date, and
# evaluates ``check_function`` against existing learning data
# (LessonProgress / ElementError / LearningSession / streak) -
# NO new tracking beyond UserMission.
#
# ``target_value`` is the count the check must reach.
# ``check_function`` returns the current count for that user/day.
#
# Bundled to frontend/src/data/missions/templates.json via
# ``make sync-missions``. Title/description i18n keys resolve in
# all 8 catalogs (missions.templates.<id>.title / .description).
templates:
  # --- LEARNING ---------------------------------------------------
  - id: complete-1-lesson
    title_key: missions.templates.complete-1-lesson.title
    description_key: missions.templates.complete-1-lesson.description
    category: learning
    target_value: 1
    difficulty: easy
    xp_reward: 20
    icon: book-open
    check_function: lessons_completed_today
