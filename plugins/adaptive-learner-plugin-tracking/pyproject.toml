[tool.poetry]
name = "adaptive-learner-plugin-tracking"
version = "1.15.0"
description = "Adaptive Learner: writes ProgressCommit on session_complete + dashboard summary aggregator."
authors = ["Asterios Raptis"]
license = "MIT"
packages = [{include = "adaptive_learner_tracking"}]

[tool.poetry.dependencies]
python = "^3.11"
pluginforge = "^0.10.0"
fastapi = "^0.136.0"
pydantic = "^2.13.0"
sqlalchemy = "^2.0.49"

[tool.poetry.plugins."adaptive_learner.plugins"]
tracking = "adaptive_learner_tracking.plugin:TrackingPlugin"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
