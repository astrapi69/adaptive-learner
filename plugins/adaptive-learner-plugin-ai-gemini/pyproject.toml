[tool.poetry]
name = "adaptive-learner-plugin-ai-gemini"
version = "1.1.0"
description = "Adaptive Learner: Google Gemini provider for the ai_complete hook."
authors = ["Asterios Raptis"]
license = "MIT"
packages = [{include = "adaptive_learner_ai_gemini"}]

[tool.poetry.dependencies]
python = "^3.11"
pluginforge = "^0.7.0"
# google-genai 2.x is the current SDK line; replaces the
# deprecated ``google.generativeai`` namespace (EOL announced
# upstream, was shipping a FutureWarning on every import).
# Pinned with a caret so a future-incompatible 3.x doesn't
# sneak in.
google-genai = "^2.0.0"

[tool.poetry.plugins."adaptive_learner.plugins"]
ai-gemini = "adaptive_learner_ai_gemini.plugin:AiGeminiPlugin"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
