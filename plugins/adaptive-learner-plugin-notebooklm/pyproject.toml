[tool.poetry]
name = "adaptive-learner-plugin-notebooklm"
version = "1.62.0"
description = "Adaptive Learner: NotebookLM-optimized study materials + active-recall questions (Phase 32)."
authors = ["Asterios Raptis"]
license = "MIT"
packages = [{include = "adaptive_learner_notebooklm"}]

[tool.poetry.dependencies]
python = "^3.11"
pluginforge = "^0.10.0"
fastapi = "^0.136.0"
pydantic = "^2.13.0"
sqlalchemy = "^2.0.49"

[tool.poetry.plugins."adaptive_learner.plugins"]
notebooklm = "adaptive_learner_notebooklm.plugin:NotebookLMPlugin"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
