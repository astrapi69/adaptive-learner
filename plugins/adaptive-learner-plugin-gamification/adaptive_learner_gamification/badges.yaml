# Badge catalog (Phase 29B / v1.16.0).
#
# Seeded on first startup via ``badge_service.seed_catalog``.
# Idempotent on the ``key`` slug — re-running the seeder is safe.
#
# ``name_key`` and ``description_key`` are references into the
# i18n catalog (``gamification.badges.{key}.name`` /
# ``.description``); the seeder does NOT translate, the frontend
# resolves at render time.
#
# Categories (Phase 29B spec):
#   - getting_started   First actions; one-shot earns.
#   - consistency       Streak milestones.
#   - method_explorer   Cross-method exploration.
#   - depth             Multi-cycle / total-session counts.
#   - polyglot          Multi-language / multi-provider use.

badges:
  # --- Getting Started ----------------------------------------
  - key: first_session
    name_key: gamification.badges.first_session.name
    description_key: gamification.badges.first_session.description
    icon: rocket
    category: getting_started
  - key: first_assessment
    name_key: gamification.badges.first_assessment.name
    description_key: gamification.badges.first_assessment.description
    icon: target
    category: getting_started
  - key: first_import
