# Pre-commit hooks. Installed by contributors with:
#
#     cd backend && poetry run pre-commit install
#
# Run manually on every tracked file:
#
#     poetry run pre-commit run --all-files
#
# Skeleton state (Phase 1A): only the formatter / linter hooks plus
# the plugin-lockfile-pairing hook stay. The Bibliogon-era custom
# hooks (roadmap archival reminder, help-meta completeness, notify-
# error coverage, theme-token completeness, module-state audit) are
# gone with their scripts; re-introduce alongside the artifacts they
# guard once the new domain has them.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # The cross-language parity goldens are asserted BYTE-FOR-BYTE
        # against ``buildLearningContext`` output, which has no trailing
        # newline. Appending one here would break the parity test, so this
        # hook must not touch them (#797 fixtures).
        exclude: ^tests/fixtures/learning-context-parity/.*\.txt$
      - id: check-yaml
        args: [--allow-multiple-documents]
        # mkdocs.yml uses pymdownx Python-tag constructors
        # (``!!python/name:material.extensions.emoji.twemoji``) that
        # PyYAML's safe_load cannot resolve. mkdocs's own loader
        # handles them; check-yaml is a syntax-only gate, so the
        # exclude is the right scope-narrowing fix rather than
        # weakening every YAML file with ``--unsafe``.
        exclude: ^mkdocs\.yml$
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
        # docs/review/ holds deliberately large, generated review artifacts
        # (e.g. the combined i18n export 100-all.md, ~1.4 MB). They are text,
        # reviewed once, and exempt from the accidental-large-blob guard. CI's
        # file-size-check only scans source (py/ts/js), so .md is unaffected there.
        exclude: ^docs/review/.*\.md$
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/app/
      - id: ruff-format
        files: ^backend/app/

  - repo: local
    hooks:
      # ESLint (#222). Runs the whole frontend/src from the frontend dir
      # (flat config resolves from cwd, not per-file). No --max-warnings
      # here so the existing warning backlog doesn't block commits — it
      # fails only on the blocking ERROR rules (rules-of-hooks, jsx-key,
      # parse errors). The warning ratchet ceiling is enforced in CI.
      - id: eslint
        name: ESLint (frontend)
        entry: bash -c 'cd frontend && npx eslint src/'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
        stages: [pre-commit]

      - id: plugin-lock-paired-with-pyproject
        name: plugin pyproject.toml must be staged with its poetry.lock
        entry: python3 scripts/check_plugin_lock_paired.py
        language: system
        files: ^plugins/adaptive-learner-plugin-[^/]+/pyproject\.toml$
        pass_filenames: true
        stages: [pre-commit]

      # Issue #47 — keep the README CONTENT-STATS block in lock-step
      # with the content repo. Fires only when README.md is staged;
      # skips (exit 0) when the content repo isn't checked out locally.
      # The authoritative gate is the CI job (fresh content checkout).
      - id: validate-bundled-content
        name: Validate content repo stats in README
        entry: python scripts/validate_bundled_content.py --write-readme
        language: python
        additional_dependencies: ["pyyaml>=6"]
        pass_filenames: false
        files: ^README\.md$
        stages: [pre-commit]

      - id: i18n-script-sanity
        name: i18n script-sanity lint (real umlauts, native scripts, #1755)
        entry: python scripts/verify_i18n_scripts.py
        language: python
        additional_dependencies: ["pyyaml>=6"]
        pass_filenames: false
        files: ^backend/config/i18n/(de|el|hi)\.yaml$
        stages: [pre-commit]

      - id: docs-hygiene
        name: docs hygiene (umlaut-substitute ratchet + exploration-index orphans)
        # --auto-lower banks a fall (improvement) into the baseline so the gain
        # rides this commit; a rise still fails. Like ruff-format, the write
        # makes pre-commit re-run so the lowered baseline is committed (#2230).
        entry: python scripts/verify_docs_hygiene.py --auto-lower
        language: python
        pass_filenames: false
        files: ^(docs/.*\.md|docs/\.docs-hygiene-baseline\.json|scripts/verify_docs_hygiene\.py)$
        stages: [pre-commit]

      - id: doc-refs
        name: doc references exist (make targets, repo paths, constants)
        # --auto-lower banks a fall (an error counter, never a budget); a rise
        # always fails. Same shape as docs-hygiene: the write makes pre-commit
        # re-run so the lowered baseline rides this commit (#2254).
        entry: python scripts/verify_doc_refs.py --auto-lower
        language: python
        pass_filenames: false
        files: ^(docs/.*\.md|\.claude/rules/.*\.md|CLAUDE\.md|docs/\.doc-refs-baseline\.json|scripts/verify_doc_refs\.py|Makefile)$
        stages: [pre-commit]
