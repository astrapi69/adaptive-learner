# Pre-commit hooks. Installed by contributors with:
#
#     cd backend && poetry run pre-commit install
#
# Run manually on every tracked file:
#
#     poetry run pre-commit run --all-files
#
# Skeleton state (Phase 1A): only the formatter / linter hooks plus
# the plugin-lockfile-pairing hook stay. The Bibliogon-era custom
# hooks (roadmap archival reminder, help-meta completeness, notify-
# error coverage, theme-token completeness, module-state audit) are
# gone with their scripts; re-introduce alongside the artifacts they
# guard once the new domain has them.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        # mkdocs.yml uses pymdownx Python-tag constructors
        # (``!!python/name:material.extensions.emoji.twemoji``) that
        # PyYAML's safe_load cannot resolve. mkdocs's own loader
        # handles them; check-yaml is a syntax-only gate, so the
        # exclude is the right scope-narrowing fix rather than
        # weakening every YAML file with ``--unsafe``.
        exclude: ^mkdocs\.yml$
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/app/
      - id: ruff-format
        files: ^backend/app/

  - repo: local
    hooks:
      - id: plugin-lock-paired-with-pyproject
        name: plugin pyproject.toml must be staged with its poetry.lock
        entry: python3 scripts/check_plugin_lock_paired.py
        language: system
        files: ^plugins/adaptive-learner-plugin-[^/]+/pyproject\.toml$
        pass_filenames: true
        stages: [pre-commit]
