# Session plugin configuration.
#
# Read by ``app.config_overlay.read_plugin_config_merged("session")``
# on every POST /api/plugins/session/{id}/message — see
# ``adaptive_learner_session.routes._read_step_evaluation_config``.

# v0.5.0 — AI-based cycle-step transition (Phase 8 dual-prompt).
#
# When ``enabled: true`` (the default), every successful /message
# round-trip fires a SECOND ai_complete call against the same
# provider; the AI returns a JSON verdict
# {advance, confidence, reason, suggested_step} and the route
# applies the suggestion iff ``advance ∧ confidence >= threshold``.
# Set ``enabled: false`` to fall back to the v0.4.x deterministic
# +1 advance (capped at 7).
step_evaluation:
  enabled: true
  # Minimum confidence for an AI-suggested transition to apply.
  # Lower = more eager transitions; higher = stickier steps. The
  # 0.7 default is the Phase 8B spec value.
  confidence_threshold: 0.7
  # max_tokens cap for the evaluator call. The JSON output is tiny
  # (~80-120 tokens in practice); the cap is a safety net against
  # verbose models. INTERNAL — only bump if logs show truncated
  # evaluation responses in the wild.
  max_tokens: 256

# v1.4.0 — Auto-loop: continue learning after step 7.
#
# When the step evaluator suggests advancing past step 7 (the
# learner has integrated the current topic), a THIRD ai_complete
# call decides the next subtopic + difficulty adjustment. If
# ``cycle_complete: true`` AND ``continue_recommended: true`` the
# session resets ``cycle_step`` to 1, increments ``cycle_count``,
# and continues with the suggested next topic. Fallback: keeps
# the v0.5.0 cap-at-7 behaviour.
auto_loop:
  enabled: true
  # Hard cap on cycles per session. Prevents runaway loops; user
  # can always end the session manually. 5 covers a deep learning
  # session without exhausting the learner.
  max_cycles: 5
  # max_tokens for the topic-transition call. The JSON output is
  # small (~150-200 tokens); the cap is a safety net. INTERNAL.
  topic_transition_max_tokens: 256
