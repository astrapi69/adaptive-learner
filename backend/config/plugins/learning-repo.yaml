# Learning Repository plugin settings (Phase 42 / BL-30).
#
# Renders per-project Markdown artefacts from existing DB state
# and (optionally) materialises them to disk under a real git
# repository for long-term tracking per the Article-3 pattern
# (Asterios Raptis, *Von Theorie zur Praxis*).
#
# Both settings below are user-facing — the Settings UI panel
# (BL-30 commit 6) lets the user toggle them without editing
# this file. They are NOT marked ``# INTERNAL`` because they
# control durable user-visible behaviour (disk writes +
# tagging) that the user must be able to opt in or out of.
settings:
  # Opt-in: when ``true``, the POST /persist endpoint runs
  # ``git init`` (if needed) + commit + optional tag under
  # ``repos_dir/{project_id}/``. When ``false`` (default),
  # /persist responds with HTTP 400 and the read-only /render
  # + /export-zip endpoints remain the only surface.
  enable_git: false
  # Filesystem location for the per-project git repositories.
  # Resolved with ``~`` expansion. The plugin creates it on
  # first persist and writes ``{project_id}/`` subdirectories
  # for each persisted project.
  repos_dir: "~/.local/share/adaptive_learner/repos"
