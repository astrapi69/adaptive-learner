# Adaptive Learner i18n-Katalog (DE — Phase 4A).
#
# Reference language EN unter ../en.yaml; jedes Catalog-File spiegelt
# dieselbe Schluesselstruktur. Plugin-spezifische Strings (Methoden-
# Beschreibungen, Cycle-Steps) bleiben hier, weil die Sechs-Methoden-
# Anatomie zum Kernmodell gehoert und nicht plugin-spezifisch ist.

app:
  name: Adaptive Learner
  tagline: Adaptives Lernen nach dem Sechs-Methoden-Modell.
  skeleton_notice: >-
    Skeleton-Stand. Domain-Modelle, Plugins und Seiten folgen in den
    naechsten Phasen — siehe docs/adaptive-learner-project-reference.md.

