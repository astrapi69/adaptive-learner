# Adaptive Learner i18n-Katalog (DE — Phase 6, korrigiert).
#
# Referenzsprache EN unter ../en.yaml; jedes Katalog-File spiegelt
# dieselbe Schlüsselstruktur. Plugin-spezifische Strings (Methoden-
# Beschreibungen, Cycle-Steps) bleiben hier, weil die Sechs-Methoden-
# Anatomie zum Kernmodell gehört und nicht plugin-spezifisch ist.
#
# Konvention: echte Umlaute (ä/ö/ü/ß). Die ASCII-Faltung
# (ae/oe/ue/ss) aus der Bibliogon-Quelle ist eine Source-Code-
# Konvention für Identifier, nicht für nutzersichtbare Texte —
# siehe `.claude/rules/lessons-learned.md` "German content uses
# real umlauts".

