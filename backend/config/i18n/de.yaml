  feedback:
    label: Feedback
    description: Korrektur mit Erklaerung.
  adapt:
    label: Anpassung
    description: Methode, Tempo oder Fokus aendern.
  repeat:
    label: Wiederholung
    description: Erneuter Versuch.
  integrate:
    label: Integration
    description: Wissen bleibt durch Erfahrung.

