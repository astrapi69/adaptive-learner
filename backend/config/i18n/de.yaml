landing:
  title: Adaptive Learner
  subtitle: Lernen, das sich an dich anpasst.
  choose_language: Sprache waehlen
  start_button: Lernreise beginnen
  intro: >-
    Adaptive Learner findet die fuer dich passende Methode aus sechs
    wissenschaftlich fundierten Lernweisen und begleitet dich mit
    einem 7-Schritte-Zyklus pro Session.

onboarding:
  title: Lernprojekt anlegen
  intro: >-
    Beschreibe dein Lernziel. Adaptive Learner nutzt diese Angaben
    fuer dein Profil und die ersten Methoden-Empfehlungen.
  field_name: Dein Name
  field_topic: Thema
  field_topic_hint: z. B. Spanisch B1 oder lineare Algebra.
  field_goal: Lernziel
  field_goal_hint: Was willst du am Ende koennen?
  field_timeframe: Zeitrahmen
  field_timeframe_hint: z. B. 4 Wochen, 1 Semester.
  field_daily_minutes: Minuten pro Tag
  field_current_problem: Aktuelles Problem
  field_current_problem_hint: optional — was bremst dich gerade?
  submit: Projekt anlegen und Assessment starten
  creating: Projekt wird angelegt …

