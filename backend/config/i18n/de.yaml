methods:
  deductive:
    label: Deduktiv
    summary: Vom Allgemeinen zum Besonderen — Regeln zuerst, Beispiele danach.
  inductive:
    label: Induktiv
    summary: Vom Besonderen zum Allgemeinen — Beispiele zuerst, Regeln ableiten.
  error_based:
    label: Fehlerzentriert
    summary: Aus Fehlern lernen — Korrektur mit Erklaerung.
  dialogic:
    label: Dialogisch
    summary: Im Gespraech denken — Stress senken, Motivation aufbauen.
  contextual:
    label: Kontextuell
    summary: Im echten Kontext anwenden — Transfer ueben.
  ai_adaptive:
    label: KI-adaptiv
    summary: Die KI waehlt fuer dich die jeweils beste Methode.

