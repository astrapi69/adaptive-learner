    label: Inductivo
    summary: De lo particular a lo general — primero los ejemplos, luego la regla.
  error_based:
    label: Basado en errores
    summary: Aprender de los errores — correccion con explicacion.
  dialogic:
    label: Dialogico
    summary: Pensar en conversacion — bajar el estres, construir motivacion.
  contextual:
    label: Contextual
    summary: Aplicar en contexto real — practicar la transferencia.
  ai_adaptive:
    label: IA adaptativa
    summary: La IA elige el metodo que mejor te encaja.
