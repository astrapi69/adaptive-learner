landing:
  title: Adaptive Learner
  subtitle: Learning that adapts to you.
  choose_language: Choose your language
  start_button: Start your learning journey
  intro: >-
    Adaptive Learner finds the method that fits you best from six
    research-backed learning approaches, and walks you through a
    seven-step cycle on every session.

onboarding:
  title: Create a learning project
  intro: >-
    Tell us about your learning goal. Adaptive Learner uses this to
    build your profile and recommend a starting method.
  field_name: Your name
  field_topic: Topic
  field_topic_hint: e.g. Spanish B1, linear algebra.
  field_goal: Goal
  field_goal_hint: What do you want to be able to do?
  field_timeframe: Time frame
  field_timeframe_hint: e.g. 4 weeks, one semester.
  field_daily_minutes: Minutes per day
  field_current_problem: Current problem
  field_current_problem_hint: optional — what is blocking you right now?
  submit: Create project and start assessment
  creating: Creating project…

