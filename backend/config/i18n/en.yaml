methods:
  deductive:
    label: Deductive
    summary: General to specific — rules first, examples after.
  inductive:
    label: Inductive
    summary: Specific to general — examples first, derive the rule.
  error_based:
    label: Error-based
    summary: Learn from mistakes — correction plus explanation.
  dialogic:
    label: Dialogic
    summary: Think in conversation — lower stress, build motivation.
  contextual:
    label: Contextual
    summary: Apply in a real context — practice transfer.
  ai_adaptive:
    label: AI-adaptive
    summary: The AI picks the method that fits you best.

cycle_steps:
  input:
    label: Input
    description: Information, example or task is presented.
  attempt:
    label: Attempt
    description: First application without a safety net.
  error:
    label: Error
    description: Mismatch between expectation and result.
  feedback:
    label: Feedback
    description: Correction with explanation.
  adapt:
    label: Adapt
    description: Adjust method, pace or focus.
  repeat:
    label: Repeat
    description: Try again.
  integrate:
    label: Integrate
    description: Knowledge sticks through experience.

