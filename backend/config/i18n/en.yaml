# Adaptive Learner i18n catalog (EN — Phase 4A).
#
# Reference language. Every other catalog mirrors this structure.
# Plugin-specific text that belongs to the core six-method model
# stays here (methods.*, cycle_steps.*) rather than living inside
# the plugins, because they describe core concepts the whole app
# leans on.

