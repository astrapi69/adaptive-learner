methods:
  deductive:
    label: Deductif
    summary: Du general au particulier — d'abord les regles, puis les exemples.
  inductive:
    label: Inductif
    summary: Du particulier au general — d'abord les exemples, puis la regle.
  error_based:
    label: Centre sur l'erreur
    summary: Apprendre des erreurs — correction avec explication.
  dialogic:
    label: Dialogique
    summary: Penser en conversation — reduire le stress, batir la motivation.
  contextual:
    label: Contextuel
    summary: Appliquer en contexte reel — pratiquer le transfert.
  ai_adaptive:
    label: IA adaptative
    summary: L'IA choisit la methode qui te convient le mieux.
