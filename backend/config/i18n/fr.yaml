methods:
  deductive:
    label: Deductive
    summary: General to specific — rules first, examples after.
  inductive:
    label: Inductive
    summary: Specific to general — examples first, derive the rule.
  error_based:
    label: Error-based
    summary: Learn from mistakes — correction plus explanation.
  dialogic:
    label: Dialogic
    summary: Think in conversation — lower stress, build motivation.
  contextual:
    label: Contextual
    summary: Apply in a real context — practice transfer.
  ai_adaptive:
    label: AI-adaptive
    summary: The AI picks the method that fits you best.
