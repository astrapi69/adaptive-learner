# Pre-seeded Subject taxonomy (Phase 22B).
#
# Loaded on first run by ``app.services.subjects_seed.seed_subjects``;
# subsequent runs are no-ops because the loader compares by ``slug``
# and skips rows that already exist. Adding a NEW node to this file
# is safe — the loader inserts it on the next startup. Renaming
# or restructuring nodes here is NOT safe: the slug is the
# identity, so a rename creates a new row and the old one stays.
#
# The shape is a flat list of nodes; ``parent`` references another
# node's slug. ``name`` is the EN display name; ``name_de`` is the
# German override. Other locales fall through to EN.
#
# Icons are short emoji or text labels the UI renders next to the
# subject name. Keep them short (<= 4 chars) so the tree row stays
# readable. Description is optional.
#
# Slugs are stable; never reuse a slug for a different concept.

