# Praise phrases (en) - EXP-008 / Phase 55A.
# Authoring surface. Bundled to frontend/src/data/praise/ via
# `make sync-praise`. Keys must stay parallel across all 8 langs
# (the phrase-picker tracks used phrases by key).
