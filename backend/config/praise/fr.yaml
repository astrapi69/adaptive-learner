# Praise phrases (fr) - EXP-008 / Phase 55A.
# Authoring surface. Bundled to frontend/src/data/praise/ via
# `make sync-praise`. Keys must stay parallel across all 8 langs
# (the phrase-picker tracks used phrases by key).
# pending native review
language: fr
categories:
  correct_answer:
    - key: ca_01
      text: "Correct !"
    - key: ca_02
      text: "Exactement !"
    - key: ca_03
      text: "Parfait !"
    - key: ca_04
      text: "C'est ça !"
    - key: ca_05
      text: "Pile poil !"
    - key: ca_06
      text: "Réussi !"
    - key: ca_07
      text: "Bien joué !"
    - key: ca_08
      text: "Oui !"
    - key: ca_09
      text: "Génial !"
    - key: ca_10
      text: "Tout à fait !"
    - key: ca_11
      text: "Tu l'as !"
    - key: ca_12
      text: "Excellent !"
    - key: ca_13
      text: "Vif !"
    - key: ca_14
      text: "Dans le mille !"
    - key: ca_15
      text: "Très bien !"
  lesson_complete:
    - key: lc_01
      text: "Leçon terminée !"
    - key: lc_02
      text: "Bien joué !"
    - key: lc_03
      text: "Beau travail !"
    - key: lc_04
      text: "Tu y es arrivé !"
    - key: lc_05
      text: "Excellent travail !"
    - key: lc_06
