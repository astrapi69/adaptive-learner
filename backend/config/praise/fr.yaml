      text: "Mieux que la dernière fois !"
    - key: im_02
      text: "Progrès !"
    - key: im_03
      text: "Ça avance !"
    - key: im_04
      text: "Tu progresses !"
    - key: im_05
      text: "Pas à pas !"
    - key: im_06
      text: "Plus près qu'avant !"
    - key: im_07
      text: "En hausse !"
    - key: im_08
      text: "Plus affûté !"
