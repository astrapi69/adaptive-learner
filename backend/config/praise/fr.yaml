      text: "{n} jours d'affilée !"
    - key: sm_02
      text: "Continue !"
    - key: sm_03
      text: "Série en cours !"
    - key: sm_04
      text: "Sur ta lancée !"
    - key: sm_05
      text: "Jour après jour !"
    - key: sm_06
      text: "La régularité paie !"
    - key: sm_07
      text: "Série de {n} jours !"
    - key: sm_08
      text: "Inarrêtable !"
  mastery:
    - key: ma_01
      text: "Maîtrisé !"
    - key: ma_02
