[tool.poetry]
name = "adaptive_learner"
version = "0.0.0"
description = "Adaptive learning system based on the six-method learning model."
authors = ["Asterios Raptis"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.136.0"
uvicorn = { extras = ["standard"], version = "^0.46.0" }
sqlalchemy = "^2.0.49"
pydantic = {version = "^2.13.0", extras = ["email"]}
platformdirs = "^4.2.0"
pluginforge = {version = "^0.5.0", extras = ["fastapi"]}
alembic = "^1.18.4"
cryptography = "^48.0.0"
ruamel-yaml = "^0.19.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
httpx = "^0.28.0"
mypy = "^1.20.0"
types-pyyaml = "^6.0.12.20250915"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.1.0"
ruff = "^0.15.11"
pre-commit = "^4.5.1"
pip-audit = "^2.10.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Conservative baseline. Tighten in follow-ups once the code is clean
# against the current set.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line length - handled by formatter, too noisy to fix blind
    "B008",   # function-call-in-default-argument - FastAPI `Depends(...)` idiom is intentional
    "UP042",  # replace-str-enum - `(str, Enum)` base class ships in migrations too; deferred
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]                       # bugbear too strict for test fixtures
"migrations/versions/*" = ["UP"]        # Alembic templates predate py312 syntax
"app/main.py" = ["E402"]                # setup_logging() before imports is intentional

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = "pluginforge.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Anchored here so pytest's rootdir discovery does not walk up to
# the repo-root pyproject.toml (which carries an unrelated coverage
# config from the python-poetry-template).

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
