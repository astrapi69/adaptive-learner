# Dependabot (#253, infra block 5).
#
# Keeps dependencies current with grouped, labelled PRs. Code ecosystems
# are checked weekly; GitHub Actions monthly (they move slower). Grouping
# minor/patch updates into a single PR per ecosystem keeps the review queue
# small — majors still come as individual PRs so breaking changes get their
# own dedicated review (matching the release-workflow dep policy).
version: 2
updates:
  # frontend/ is managed by Bun as of #1492 (this PR removed package-lock.json
  # for bun.lock). Dependabot supports bun.lock version updates (GA 2025-02-13,
  # verified in the Phase 0 gate); on "npm" it would look for the now-absent
  # package-lock.json and stop updating the frontend until Phase 2. e2e/ has no
  # entry here and stays on npm.
  - package-ecosystem: "bun"
    directory: "/frontend"
    # Gitflow (#334): open update PRs against develop, not main.
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      backend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
