# Visual baseline sync (#1662).
#
# WHY: the `update_baselines=true` dispatch of `visual-regression.yml`
# (#1532) renders the baseline PNGs IN CI and uploads them as the
# `visual-baselines` artifact, deliberately never auto-committing them.
# Getting that artifact onto the PR branch means download -> review ->
# commit, an authenticated network step the automated agents working
# these PRs cannot perform: the artifact host (`*.blob.core.windows.net`)
# is egress-blocked for CCW/Claude-Code sessions, and non-authenticated
# web contexts have no `gh` token. So the artifact->commit handshake
# bounced back to the maintainer's machine on EVERY visual-critical PR
# (#1540/#1567, #1648/#1649, ...).
#
# WHAT: this workflow renders the baselines in CI (same environment as
# `visual-regression.yml`, so font anti-aliasing matches - #1532) and
# pushes them straight onto the PR head branch as a
# `chore(visual): refresh baselines` commit. The artifact download step
# disappears entirely - the runner already has the freshly rendered PNGs
# in its checkout.
#
# Human review stays MANDATORY (#1532): the push lands as a normal commit
# IN the PR, reviewed image by image before merge. It is NEVER merged
# here and NEVER a blind auto-accept. The #1640 presence gate stays; this
# only changes HOW the baselines get onto the branch, not that they must.
#
# HOW to trigger (either works for a human OR an agent):
#   - add the `refresh-visual-baselines` label to the PR, or
#   - dispatch this workflow with the PR number:
#       gh workflow run visual-baseline-sync.yml -f pr_number=<N>
#
# ONE-TIME maintainer setup (see docs/developer/testing.md):
#   - create the `refresh-visual-baselines` label once, and
#   - (optional but recommended) add a `VISUAL_BASELINE_TOKEN` PAT/App
#     token secret with `contents: write`. With it, the pushed baseline
#     commit re-triggers the "Visual baseline gate" so it goes green
#     automatically. Without it, the push still works but the gate must be
#     re-run once (a pushed-by-GITHUB_TOKEN commit does not re-trigger PR
#     workflows) - the PR comment spells this out.
#   The PR housekeeping steps (label removal + status comment) use the
#   default GITHUB_TOKEN, scoped via the job `permissions:` block, so they
#   do NOT depend on the PAT's scope (#2014).
#
# THREE JOBS, not one (#2673): the render step needs the Playwright browser
# pre-baked into a container image (see the `render` job comment below) to
# avoid the #317/#1248 CDN-hang class, but that container has no `gh` CLI.
# `gh pr view` / `gh pr edit` / `gh pr comment` therefore run in plain
# `ubuntu-latest` jobs before/after the containerized render.

name: Visual baseline sync

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number whose head branch should receive the refreshed baselines."
        type: string
        required: true

concurrency:
  group: visual-baseline-sync-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve:
    name: Resolve PR + head branch
    # Label path: only the dedicated label. Dispatch path: always.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.label.name == 'refresh-visual-baselines'
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      branch: ${{ steps.head.outputs.branch }}
    env:
      GH_TOKEN: ${{ secrets.VISUAL_BASELINE_TOKEN || github.token }}
    steps:
      - name: Resolve PR number
        id: pr
        # Event-derived values go through env (never interpolated into the
        # script body) so a crafted PR number / branch name can't inject.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::PR number must be a positive integer, got: '$PR_NUMBER'."
              exit 1
              ;;
          esac
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Look up the PR head branch
        id: head
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          data=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json headRefName,isCrossRepository,state)
          state=$(echo "$data" | jq -r '.state')
          cross=$(echo "$data" | jq -r '.isCrossRepository')
          branch=$(echo "$data" | jq -r '.headRefName')
          if [ "$state" != "OPEN" ]; then
            echo "::error::PR #$PR_NUMBER is $state - nothing to sync."
            exit 1
          fi
          if [ "$cross" = "true" ]; then
            echo "::error::PR #$PR_NUMBER comes from a fork - this workflow cannot push to a fork branch (#1662). Refresh the baselines locally and ask the author to push, or push from a same-repo branch."
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  render:
    name: Render + push visual baselines onto the PR branch
    needs: resolve
    runs-on: ubuntu-latest
    # Run inside the official Playwright image so Chromium + the headless
    # shell are PRE-BAKED - no cdn.playwright.dev download (the #317 failure
    # mode: the CDN was unreachable from the runner, so `npx playwright
    # install` hung at zero bytes; actions/cache could not help because the
    # first download never succeeded). The image is pulled from
    # mcr.microsoft.com, which the runner reaches fine, and is the
    # established fix already used by dexie-smoke.yml + manual-automation.yml
    # + release-prepare.yml + release.yml. Pin the tag to the
    # @playwright/test version in e2e/package.json (1.61.1); bump both
    # together. Refs #317, #1248, #2673.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      # --user 1001 = the runner user, so checkout-owned files stay writable
      # (matches dexie-smoke.yml; also means no root-vs-uid-1001 "dubious
      # ownership" git config is needed for the later commit + push, #2035).
      options: --user 1001
    env:
      BRANCH: ${{ needs.resolve.outputs.branch }}
    outputs:
      changed: ${{ steps.push.outputs.changed }}
      pushed_with: ${{ steps.push.outputs.pushed_with }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.branch }}
          token: ${{ secrets.VISUAL_BASELINE_TOKEN || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # NOT oven-sh/setup-bun here: it unpacks the Bun zip with `unzip`,
      # which the Playwright noble image does not ship, and the job runs as
      # --user 1001 (no apt). The npm distribution of Bun carries the binary
      # as a plain npm tarball (no unzip), installed to a user-writable
      # prefix (#1530, same pattern as dexie-smoke.yml).
      - name: Install Bun 1.3.14 (npm; image lacks unzip for setup-bun)
        run: |
          npm install --global --prefix "$HOME/.bun-npm" bun@1.3.14
          echo "$HOME/.bun-npm/bin" >> "$GITHUB_PATH"

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock', 'e2e/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build dexie frontend
        working-directory: frontend
        run: VITE_STORAGE_MODE=dexie bun run build

      - name: Install e2e deps
        working-directory: e2e
        run: bun install --frozen-lockfile

      # NO `playwright install` step: the browsers are baked into the
      # container. This is the whole point of the fix (#2673).

      # Same config + environment as visual-regression.yml, so the
      # rendered PNGs match what the nightly diff compares against.
      - name: Regenerate baselines
        working-directory: e2e
        run: npx playwright test --config=playwright.visual.config.ts --update-snapshots

      - name: Commit + push refreshed baselines
        id: push
        env:
          FALLBACK_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # #2719 - `git status --porcelain`, NOT `git diff`: a baseline
          # DELETED on the PR branch and freshly re-rendered by
          # --update-snapshots is an UNTRACKED file, invisible to git diff.
          # Delete-then-resync is the only way to force a rewrite of a
          # wrong-but-within-tolerance baseline (update mode rewrites only
          # on a FAILED comparison, #2712), so the old check silently
          # discarded exactly the renders that path exists to produce.
          if [ -z "$(git status --porcelain -- e2e/visual/screenshots)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Baselines already current - nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual/screenshots
          git commit \
            -m "chore(visual): refresh baselines (#1662)" \
            -m "CI-rendered visual baselines, auto-synced by visual-baseline-sync. Review every changed PNG before merge (#1532)."

          # The branch can move under us while "Regenerate baselines" above
          # was running (~25 min: a develop back-merge, another concurrent
          # run, a manual "Update branch"), so a plain push can be rejected
          # as non-fast-forward even though nothing about OUR change
          # conflicts. Retry with a fetch + rebase in between - the commit
          # here touches only e2e/visual/screenshots, so it replays cleanly
          # onto whatever else landed on the branch meanwhile (#2677).
          #
          # Prefer the PAT push - it re-triggers the Visual baseline gate. If
          # the PAT lacks contents:write or is otherwise rejected (#2435),
          # fall back to the default GITHUB_TOKEN (the job declares
          # contents:write) so the baselines still land; the gate then needs
          # a one-time manual re-run, which the PR comment below already
          # spells out. The `-c ...extraheader=` clears the PAT auth header
          # actions/checkout persisted, so the fallback actually uses the
          # GITHUB_TOKEN in the URL instead of re-sending the PAT.
          MAX_ATTEMPTS=5
          ATTEMPT=1
          PAT_OK=0
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            if OUTPUT=$(git push origin "HEAD:$BRANCH" 2>&1); then
              printf '%s\n' "$OUTPUT"
              PAT_OK=1
              break
            fi
            printf '%s\n' "$OUTPUT"
            if printf '%s' "$OUTPUT" | grep -qi "permission denied\|error: 403"; then
              echo "::notice::PAT push denied (permission, #2435) - not a race, skipping retries for this token."
              break
            fi
            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "::warning::PAT push still rejected after $MAX_ATTEMPTS attempts."
              break
            fi
            echo "::warning::PAT push rejected (attempt $ATTEMPT/$MAX_ATTEMPTS, branch likely moved) - fetching + rebasing onto the current $BRANCH tip and retrying."
            git fetch origin "$BRANCH"
            git rebase FETCH_HEAD
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$PAT_OK" = "1" ]; then
            echo "pushed_with=pat" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Falling back to the default GITHUB_TOKEN (#2435); the Visual baseline gate will need a one-time manual re-run."
            ATTEMPT=1
            TOKEN_OK=0
            while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
              if OUTPUT=$(git -c http.https://github.com/.extraheader= push \
                "https://x-access-token:${FALLBACK_TOKEN}@github.com/${REPO}.git" \
                "HEAD:$BRANCH" 2>&1); then
                printf '%s\n' "$OUTPUT"
                TOKEN_OK=1
                break
              fi
              printf '%s\n' "$OUTPUT"
              if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
                echo "::error::GITHUB_TOKEN push still rejected after $MAX_ATTEMPTS attempts."
                break
              fi
              echo "::warning::GITHUB_TOKEN push rejected (attempt $ATTEMPT/$MAX_ATTEMPTS, branch likely moved) - fetching + rebasing onto the current $BRANCH tip and retrying."
              git fetch origin "$BRANCH"
              git rebase FETCH_HEAD
              ATTEMPT=$((ATTEMPT + 1))
            done
            if [ "$TOKEN_OK" = "1" ]; then
              echo "pushed_with=github_token" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Failed to push refreshed baselines onto $BRANCH after retries with both tokens."
              exit 1
            fi
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Pushed refreshed baselines to $BRANCH. Review the changed PNGs image by image (#1532) - NOT auto-merged."

  notify:
    name: PR housekeeping (label + comment)
    needs: [resolve, render]
    # Run whenever `resolve` actually executed (regardless of whether
    # `render` succeeded, so a render failure still gets reported) - but NOT
    # when `resolve` itself was skipped by the job-level trigger guard above
    # (an unrelated label event on the PR must stay silent).
    if: always() && needs.resolve.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Remove the trigger label
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          # Use the default GITHUB_TOKEN (scoped via the job ``permissions:``
          # block) for PR housekeeping, NOT the VISUAL_BASELINE_TOKEN PAT — the
          # PAT is only needed for the push (so the commit re-triggers the
          # gate) and may lack pull-requests scope (#2014).
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$REPO" \
            --remove-label refresh-visual-baselines

      - name: Comment on the PR
        continue-on-error: true
        env:
          # Default GITHUB_TOKEN (job-``permissions``-scoped), not the PAT — see
          # the label step above (#2014).
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ needs.render.outputs.changed }}
          PUSHED_WITH: ${{ needs.render.outputs.pushed_with }}
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            body=$'Refreshed the CI-rendered visual baselines and pushed them to this branch as `chore(visual): refresh baselines` (#1662).\n\n**Review every changed PNG image by image before merge** — auto-sync never means blind accept (#1532).'
            if [ "$PUSHED_WITH" != "pat" ]; then
              body="$body"$'\n\n_Pushed with the default `GITHUB_TOKEN`, so the **Visual baseline gate** check does not re-trigger automatically. Re-run that check once (or toggle any label) and it passes now that the baselines are present. Configuring a `VISUAL_BASELINE_TOKEN` PAT removes this last step._'
            fi
          elif [ "$CHANGED" = "false" ]; then
            body=$'`visual-baseline-sync` ran, but the CI-rendered baselines already matched — nothing to push (#1662). If the gate is still red, the visual-critical change may be genuinely 0-diff (consider the `visual-baselines-unaffected` label).'
          else
            body=$'`visual-baseline-sync` did not complete — see the workflow run for details (#1662).'
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body"
