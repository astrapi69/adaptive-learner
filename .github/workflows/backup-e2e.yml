name: Backup round trip E2E

# #3693 - the browser backup specs (e2e/dexie/backup-*.spec.ts) ran only in
# the nightly Dexie smoke and on release branches, so they never ran on the
# PR that changed the backup and could not be the evidence before its merge.
# This workflow runs them on every PR that touches a backup path. The
# generic spec (backup-every-table-roundtrip) proves every BACKUP_TABLES
# table through the real Export -> wipe -> Import UI; the others pin single
# data shapes. BACKUP-AKZEPTANZTEST (quality-checks.md) accepts this run as
# the round-trip evidence; the manual round trip stays for what only a real
# device shows.

on:
  pull_request:
    paths:
      - "frontend/src/storage/backup/**"
      - "frontend/src/lib/backup/**"
      - "frontend/src/storage/dexie/**"
      - "frontend/src/storage/sync/**"
      - "frontend/src/components/settings/data/**"
      - "backend/app/services/backup*.py"
      - "backend/app/services/sync_tables.py"
      - "backend/app/models/**"
      - "e2e/dexie/backup-*.spec.ts"
      - "e2e/playwright.dexie.config.ts"
      - ".github/workflows/backup-e2e.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backup-e2e:
    name: Backup round trip (Dexie)
    runs-on: ubuntu-latest
    # Same container as dexie-smoke.yml: the browsers are baked in (#2715).
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Bun 1.3.14 (npm; image lacks unzip for setup-bun)
        run: |
          npm install --global --prefix "$HOME/.bun-npm" bun@1.3.14
          echo "$HOME/.bun-npm/bin" >> "$GITHUB_PATH"

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock', 'e2e/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install e2e deps
        working-directory: e2e
        run: bun install --frozen-lockfile

      - name: Build dexie frontend
        working-directory: frontend
        run: VITE_STORAGE_MODE=dexie bun run build

      # Every backup spec, not a hand-picked list: a new backup-*.spec.ts runs
      # here without an edit. Fails closed when none is found (#2083).
      - name: Backup specs
        working-directory: e2e
        # The container's default shell is sh (dash), which has no pipefail.
        shell: bash
        run: |
          set -o pipefail
          count=$(ls dexie/backup-*.spec.ts | wc -l)
          echo "::notice::running ${count} backup specs"
          test "$count" -ge 2
          npx playwright test --config=playwright.dexie.config.ts dexie/backup-

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backup-e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
