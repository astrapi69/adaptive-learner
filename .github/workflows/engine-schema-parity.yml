# App-vs-engine schema-parity gate (#1393, mirror-decoupling stage).
#
# The content repos mirror the lesson schema from the learn-content-engine
# npm release (pinned there), no longer from this app repo. The chain that
# keeps everyone honest is: Pydantic models (SoT, make sync-schema) ->
# engine (documented schema-sync procedure, bundles the schema) -> content
# repos (pinned mirror). This job closes the chain on the app side: the
# committed, app-generated schema/lesson.schema.json +
# schema/content-manifest.schema.json must be byte-identical to the
# artifacts bundled by the engine release pinned in schema/engine-pin.json.
#
# A red run is the DEFINED signal that the app schema moved ahead of the
# pinned engine release: do the engine follow-up release, then bump the pin
# in a deliberate PR. The gate's mechanics are unit-tested offline in
# backend/tests/test_engine_schema_parity.py; this job does the networked
# comparison against the npm registry tarball (immutable per version).
name: Engine schema parity

# Deliberately NOT a pull_request gate: an app schema bump necessarily
# lands BEFORE the engine can sync from it, so a per-PR parity check
# would deadlock the chain (the PR could never go green). The gate runs
# post-merge + as a daily heartbeat instead — red there is the expected
# to-do signal, not a merge blocker (night-shift rule, #575).
on:
  push:
    branches: [develop, main]
    paths:
      - "schema/**"
      - "scripts/check_engine_schema_parity.py"
      - ".github/workflows/engine-schema-parity.yml"
  # Manual trigger + a daily heartbeat so an engine-release mismatch is
  # surfaced even without an app-side schema push.
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

# Coerce Node-runtime actions onto Node 24 as a safety net for any
# action still defaulting to the deprecated Node 20 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compare app schemas against the pinned engine release
        run: python scripts/check_engine_schema_parity.py
