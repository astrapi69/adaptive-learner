name: Deploy GitHub Pages

# Phase 10G + 11G — publish the Dexie-mode frontend at the root
# AND the MkDocs documentation site at /docs/ to GitHub Pages.
# Triggered on every push to main; the workflow can also be run
# manually from the Actions tab. Frontend uses the Dexie storage
# backend (no backend required); docs are static MkDocs Material
# in DE + EN.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Defensive opt-in: any JavaScript-runtime action still declaring
# Node 20 (third-party or stragglers) is coerced to Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # GH Pages serves the site under ``/<repo>/``. Vite's ``base``
  # reads this env so every asset URL gets the right prefix.
  VITE_BASE: "/adaptive-learner/"
  # Force the Dexie storage backend on the deployed site; the
  # storage factory falls back to ApiStorage when this is empty.
  VITE_STORAGE_MODE: "dexie"
  # No backend in the public deployment.
  VITE_API_BASE: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history for git-revision-date plugin in mkdocs

      # Phase 62 (EXP-018 follow-up): the lesson content lives in the
      # separate astrapi69/adaptive-learner-content repo. Check it out
      # so copy-bundled-content.mjs can bundle it into the static site
      # (offline-first). Without this step the build fails open and the
      # deployed site ships with no bundled content.
      - name: Check out content repo
        uses: actions/checkout@v6
        with:
          repository: astrapi69/adaptive-learner-content
          path: adaptive-learner-content
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Issue #47 — double-safety drift gate on the deploy path
      # (the PR gate lives in ci.yml). Fails the deploy if the README
      # CONTENT-STATS block drifted from the content repo we are about
      # to bundle.
      - name: Validate README content stats against the content repo
        env:
          ADAPTIVE_LEARNER_CONTENT_DIR: ${{ github.workspace }}/adaptive-learner-content
        run: |
          pip install pyyaml
          python3 scripts/validate_bundled_content.py --check-readme

      - name: Install Poetry
        run: pipx install poetry

      # ---- Frontend build ----

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Compute build metadata
        run: |
          echo "VITE_BUILD_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "VITE_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # Point the bundled-content script at the content-repo
          # checkout (above). Absolute path so it resolves
          # independent of the frontend working-directory.
          ADAPTIVE_LEARNER_CONTENT_DIR: ${{ github.workspace }}/adaptive-learner-content
          # Build provenance shown in Settings -> About (the GH-Pages
          # build runs Dexie mode, which has no backend git to read).
          VITE_BUILD_HASH: ${{ env.VITE_BUILD_HASH }}
          VITE_BUILD_DATE: ${{ env.VITE_BUILD_DATE }}

      # The default SPA-router fallback for GH Pages is to copy
      # index.html to 404.html. Without it, any direct hit on a
      # nested route (``/dashboard``, ``/settings``) returns a
      # GH-Pages 404 instead of letting React Router resolve the
      # path client-side.
      - name: Configure SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      # ---- Docs build ----

      - name: Install docs dependencies
        working-directory: docs
        run: poetry install --no-interaction

      - name: Generate MkDocs navigation from _meta.yaml
        working-directory: docs
        run: poetry run python ../scripts/generate_mkdocs_nav.py

      - name: Build docs
        working-directory: docs
        # ``--site-dir`` is resolved by mkdocs relative to the
        # CONFIG FILE'S directory (= repo root for -f ../mkdocs.yml),
        # not the working directory. The earlier ``../frontend/...``
        # path therefore landed one level ABOVE the repo (outside
        # the checkout) and the docs never made it into the
        # upload-pages-artifact bundle. Use the repo-root-relative
        # path instead.
        run: poetry run mkdocs build -f ../mkdocs.yml --site-dir frontend/dist/docs

      # ---- Upload combined artifact ----

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
