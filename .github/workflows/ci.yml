name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Defensive opt-in: any JavaScript-runtime action still declaring
# Node 20 (third-party or stragglers) is coerced to Node 24. After
# the 2026-05-14 standard-action bumps (checkout v5, setup-python v6,
# setup-node v5, upload-artifact v6, cache v5, configure-pages v6,
# upload-pages-artifact v5, deploy-pages v5, softprops/action-gh-release v3)
# every action we use natively runs on Node 24, so this is now a
# safety net for future additions rather than an active fix.
# Default Node 20 is removed September 16th 2026 per
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Cache Poetry's virtualenv keyed on poetry.lock + python
      # version. Saves ~15-30s per run on the backend job
      # (test-infrastructure-audit 2026-05-12 finding 0.5.1).
      # The frontend job already does this via setup-node's
      # ``cache: "npm"``; backend was the asymmetry.
      - name: Cache Poetry virtualenv (backend)
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-backend-${{ runner.os }}-py3.12-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-backend-${{ runner.os }}-py3.12-

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-ansi

      - name: Run backend tests
        working-directory: backend
        # ``-q`` instead of ``-v``: 1601 tests printed verbose is
        # noise on a green run. Test-infrastructure audit
        # finding 0.5.4. Failures still print full traceback;
        # ``-q`` only quietens the per-test pass logs.
        run: poetry run pytest tests/ -q

  # Plugin matrix job: skeleton ships zero plugins, so this job is
  # disabled. When the user adds their first plugin, re-enable by
  # populating the `matrix.plugin` list with the plugin directory
  # name(s) under plugins/, and remove the `if: false` gate.
  #
  # plugin-tests:
  #   name: Plugin Tests
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 15
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       plugin:
  #         - adaptive-learner-plugin-<your-plugin-name>
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: actions/setup-python@v6
  #       with:
  #         python-version: "3.12"
  #     - name: Cache Poetry virtualenv (${{ matrix.plugin }})
  #       uses: actions/cache@v5
  #       with:
  #         path: ~/.cache/pypoetry/virtualenvs
  #         key: poetry-${{ matrix.plugin }}-${{ runner.os }}-py3.12-${{ hashFiles(format('plugins/{0}/poetry.lock', matrix.plugin)) }}
  #         restore-keys: |
  #           poetry-${{ matrix.plugin }}-${{ runner.os }}-py3.12-
  #     - name: Install Poetry
  #       run: pip install poetry
  #     - name: Install plugin dependencies
  #       working-directory: plugins/${{ matrix.plugin }}
  #       run: poetry install --no-interaction --no-ansi
  #     - name: Run plugin tests
  #       working-directory: plugins/${{ matrix.plugin }}
  #       run: poetry run pytest tests/ -v

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      # ESLint (#222). --max-warnings is a ratchet ceiling set at the
      # current count; it can only go DOWN. New warnings fail CI; the
      # blocking errors (react-hooks/rules-of-hooks, react/jsx-key) have
      # zero current violations.
      - name: ESLint
        working-directory: frontend
        run: npx eslint src/ --max-warnings 436

      # Circular-dependency guard (#251). Fails only when import cycles
      # EXCEED the documented baseline, so a NEW cycle is a hard error while
      # the pre-existing debt (#252) doesn't block CI. Uses npx-pinned madge
      # (peer-incompatible with TS 6 as a devDependency; CI-only tool).
      - name: Circular dependency check
        working-directory: frontend
        run: npm run check:circular

      # Prettier (#254, step 1 — non-blocking). Reports formatting drift in
      # the log without failing the build; the repo-wide reformat is a
      # separate step-2 PR. Remove continue-on-error once the codebase is
      # formatted and the format-on-touch hook has caught up.
      - name: Prettier check (non-blocking)
        working-directory: frontend
        run: npm run format:check
        continue-on-error: true

      # Stylelint (#257). Focused config: color-no-invalid-hex is a hard
      # error (clean baseline blocks new invalid hex); no-duplicate-selectors
      # / no-descending-specificity / declaration-no-important are warnings
      # (36 pre-existing, reported not blocked — drive to zero then promote).
      - name: Stylelint
        working-directory: frontend
        run: npm run lint:css

      - name: Run Vitest
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npx vite build

      # Dependency vulnerability scan (#224). --audit-level=high so
      # moderate/low advisories surface in the log without blocking the
      # build; a high/critical advisory fails CI for immediate triage.
      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run hooks on all files
        # SKIP the format-on-touch Prettier hook (#254): it --writes whatever
        # files it's given, and --all-files passes the whole tree — which
        # (step 1, ~90% unformatted) would reformat everything and fail. It's
        # a per-commit incremental hook, not an all-files gate; the
        # non-blocking `format:check` step in frontend-tests reports drift.
        env:
          SKIP: prettier-frontend
        run: pre-commit run --all-files --show-diff-on-failure

  lint-and-type-check:
    name: Backend ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Reuse the same backend Poetry cache as the test job
      # (same key). Mypy needs the SQLAlchemy + Pydantic
      # stub-bearing venv that ``poetry install`` produces.
      - name: Cache Poetry virtualenv (backend)
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-backend-${{ runner.os }}-py3.12-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-backend-${{ runner.os }}-py3.12-
      - name: Install Poetry
        run: pip install poetry
      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-ansi
      - name: ruff check
        working-directory: backend
        run: poetry run ruff check app/
      - name: mypy
        working-directory: backend
        run: poetry run mypy app/
      # Dependency vulnerability scan (#224). pip-audit is a backend dev
      # dep; --skip-editable skips the local path-dep plugins (no PyPI
      # advisories). Audits the third-party dependency tree; a known
      # advisory fails CI for triage.
      - name: pip-audit (backend deps)
        working-directory: backend
        run: poetry run pip-audit --skip-editable

  docs-verification:
    name: Docs drift verifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # verify_docs.py is stdlib-only; PyYAML is needed only for the
      # _meta.yaml <-> mkdocs.yml nav-sync check below.
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Verify documentation for drift
        run: python3 scripts/verify_docs.py
      - name: Verify mkdocs nav is in sync with _meta.yaml
        run: python3 scripts/generate_mkdocs_nav.py --check

  content-validation:
    # Issue #47 — the authoritative gate against stale-content drift
    # (Bug #44). Checks out the content repo FRESH so the README
    # CONTENT-STATS block is validated against the true current
    # content, not the gitignored bundle. Red pipeline if the README
    # counts drifted from the content repo.
    name: Content stats drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check out content repo
        uses: actions/checkout@v5
        with:
          repository: astrapi69/adaptive-learner-content
          path: adaptive-learner-content
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate README content stats against the content repo
        env:
          ADAPTIVE_LEARNER_CONTENT_DIR: ${{ github.workspace }}/adaptive-learner-content
        run: python3 scripts/validate_bundled_content.py --check-readme
