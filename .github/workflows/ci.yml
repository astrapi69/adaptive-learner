name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Defensive opt-in: any JavaScript-runtime action still declaring
# Node 20 (third-party or stragglers) is coerced to Node 24. After
# the 2026-05-14 standard-action bumps (checkout v5, setup-python v6,
# setup-node v5, upload-artifact v6, cache v5, configure-pages v6,
# upload-pages-artifact v5, deploy-pages v5, softprops/action-gh-release v3)
# every action we use natively runs on Node 24, so this is now a
# safety net for future additions rather than an active fix.
# Default Node 20 is removed September 16th 2026 per
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Path-detection so a frontend-only / CSS PR skips the backend + plugin
  # test STEPS (their poetry install + suite), which cover none of those
  # changes. The jobs still RUN, so the required checks report success (no
  # pending-required-check trap) - they just exit fast when nothing
  # backend-relevant changed. Push to develop/main always runs the full
  # suite (the merge gate) via the ``!= 'pull_request'`` half of each gate.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # schema/** is a SHARED both-sides path (#1658): the backend drift
          # test regenerates lesson.schema.json from the Pydantic models, and
          # the frontend schema-mirror check reads the same file - a change
          # there must run BOTH suites.
          filters: |
            backend:
              - 'backend/**'
              - 'plugins/**'
              - '**/*.py'
              - 'Makefile'
              - 'schema/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'Makefile'
              - 'schema/**'
              - '.github/workflows/ci.yml'

  backend-tests:
    name: Backend Tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Cache Poetry's virtualenv keyed on poetry.lock + python
      # version. Saves ~15-30s per run on the backend job
      # (test-infrastructure-audit 2026-05-12 finding 0.5.1).
      # The frontend job already does this via setup-node's
      # ``cache: "npm"``; backend was the asymmetry.
      - name: Cache Poetry virtualenv (backend)
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-backend-${{ runner.os }}-py3.12-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-backend-${{ runner.os }}-py3.12-

      - name: Install Poetry
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        run: pip install poetry

      - name: Install backend dependencies
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: poetry install --no-interaction --no-ansi

      # Test Impact Analysis (#615): on a PR we run only the tests whose
      # covered source changed, via pytest-testmon. The .testmondata DB is
      # cached so successive PR runs reuse it. The key carries the run id so
      # each run writes a FRESH cache entry; restore-keys falls back to the
      # most recent matching prefix, keeping the DB warm + current. A
      # cache-miss leaves no .testmondata, so testmon runs the FULL suite and
      # builds the DB — the natural fallback (no silent skip). Push to
      # develop/main + nightly + release always run the full suite (below).
      - name: Restore testmon data (PR only)
        if: github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true'
        uses: actions/cache@v6
        with:
          path: backend/.testmondata
          key: testmon-${{ runner.os }}-py3.12-${{ hashFiles('backend/poetry.lock') }}-${{ github.run_id }}
          restore-keys: |
            testmon-${{ runner.os }}-py3.12-${{ hashFiles('backend/poetry.lock') }}-

      - name: Run backend tests (selective on PR, full on push)
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        working-directory: backend
        # On PR: pytest --testmon runs only impacted tests (Test Impact
        # Analysis, #615). On push to develop/main: the FULL suite, the merge
        # gate. ``-q`` keeps the green-run log quiet (failures still print full
        # tracebacks). testmon is order-independent, so pytest-randomly is left
        # on. Exit code 5 ("no tests collected") is only reachable via testmon
        # deselecting everything (nothing impacted) — treated as success, not a
        # silent skip; the nightly full suite is the safety net for false
        # negatives.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice::PR detected — Test Impact Analysis (pytest --testmon)"
            set +e
            poetry run pytest tests/ -q --testmon
            code=$?
            set -e
            if [ "$code" = "5" ]; then
              echo "::notice::testmon selected no impacted tests — OK"
              exit 0
            fi
            exit $code
          else
            echo "::notice::Push to ${{ github.ref_name }} — FULL backend suite"
            poetry run pytest tests/ -q
          fi

  # Plugin tests (#434 Goal A): run every plugin's own suite in CI via
  # `make test-plugins`, which executes each `plugins/*/tests/` through the
  # BACKEND venv (PLUGIN_PYTHON). The backend `poetry install` path-installs
  # every plugin (develop = true) and carries pytest, so no per-plugin
  # dev-group or lockfile is needed. This closes the gap where the ~808
  # plugin test functions ran only locally (`make test-plugins`) with zero CI
  # coverage. Goal B (the isolated per-plugin matrix as a lock-drift gate)
  # stays deferred — see issue #434.
  #
  # Trigger note: GitHub Actions has no native per-job `paths` filter, and a
  # path-detector job / separate workflow would breach the "one job only"
  # scope of #434, so this runs on the standard CI triggers (push / PR to
  # develop + main), which already cover plugins/** and backend/** changes.
  # It is cheap — seconds over the cached backend venv, free public minutes.
  #
  # Test Impact Analysis (#615) deliberately does NOT apply here: the plugin
  # suite (~37s) is too cheap to optimise, and `make test-plugins` runs each
  # plugin's pytest in its own dir (per-dir .testmondata = no shared gain).
  # Plugins always run the full suite on every trigger.
  plugin-tests:
    name: Plugin Tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Same cache key as backend-tests: make test-plugins reuses the backend
      # venv, so the two jobs share the warmed virtualenv cache.
      - name: Cache Poetry virtualenv (backend)
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-backend-${{ runner.os }}-py3.12-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-backend-${{ runner.os }}-py3.12-

      - name: Install Poetry
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        run: pip install poetry

      - name: Install backend dependencies (path-installs every plugin)
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: poetry install --no-interaction --no-ansi

      - name: Run plugin tests (make test-plugins via the backend venv)
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        run: make test-plugins

  # Plugin matrix job: skeleton ships zero plugins, so this job is
  # disabled. When the user adds their first plugin, re-enable by
  # populating the `matrix.plugin` list with the plugin directory
  # name(s) under plugins/, and remove the `if: false` gate.
  #
  # plugin-tests:
  #   name: Plugin Tests
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 15
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       plugin:
  #         - adaptive-learner-plugin-<your-plugin-name>
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: actions/setup-python@v6
  #       with:
  #         python-version: "3.12"
  #     - name: Cache Poetry virtualenv (${{ matrix.plugin }})
  #       uses: actions/cache@v6
  #       with:
  #         path: ~/.cache/pypoetry/virtualenvs
  #         key: poetry-${{ matrix.plugin }}-${{ runner.os }}-py3.12-${{ hashFiles(format('plugins/{0}/poetry.lock', matrix.plugin)) }}
  #         restore-keys: |
  #           poetry-${{ matrix.plugin }}-${{ runner.os }}-py3.12-
  #     - name: Install Poetry
  #       run: pip install poetry
  #     - name: Install plugin dependencies
  #       working-directory: plugins/${{ matrix.plugin }}
  #       run: poetry install --no-interaction --no-ansi
  #     - name: Run plugin tests
  #       working-directory: plugins/${{ matrix.plugin }}
  #       run: poetry run pytest tests/ -v

  frontend-tests:
    name: Frontend Tests
    # #1658 - symmetric to the #1617 backend gate: on a pure-backend PR the
    # expensive steps below skip; the JOB still runs and reports success, so
    # a (future) required-check setup can never hit the skipped-job trap.
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — full history so `vitest run --changed origin/<base>`
      # (#615 Test Impact Analysis) can diff the PR against its base branch.
      # Shallow (depth 1) would leave origin/<base> unresolvable.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node 24 stays the RUNTIME (Vite build, Vitest, tsc); Bun is only the
      # package manager + script runner (#1492 Phase 1). No npm cache on
      # setup-node — the bun install cache below replaces it.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        # --frozen-lockfile is the bun equivalent of `npm ci` (no lockfile
        # mutation). No --legacy-peer-deps needed: bun resolves the tree
        # without npm's peer-dep strictness (#1492).
        run: bun install --frozen-lockfile

      - name: TypeScript type check
        if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: bunx tsc --noEmit

      # D1b (#1521) drift gate (frontend half): the TS lesson types now come
      # from learn-content-engine, so this gate only keeps the bundle-local
      # ajv schema mirror in sync with schema/lesson.schema.json. Fails if the
      # mirror is stale vs the committed schema. The Python half
      # (schema/quality-rules/doc) is covered by backend
      # test_lesson_schema_drift.py.
      - name: Lesson schema mirror drift check
        if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: node scripts/sync-schema-mirror.mjs --check

      # ESLint (#222, #220). The ratchet reached zero: the suite is clean,
      # so the ceiling is 0 — any new warning fails CI. Blocking errors
      # (react-hooks/rules-of-hooks, react/jsx-key) also have zero violations.
      - name: ESLint
        if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: bunx eslint src/ --max-warnings 0

      # Circular-dependency guard (#251). Fails only when import cycles
      # EXCEED the documented baseline, so a NEW cycle is a hard error while
      # the pre-existing debt (#252) doesn't block CI. Uses npx-pinned madge
      # (peer-incompatible with TS 6 as a devDependency; CI-only tool).
      - name: Circular dependency check
        if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: bun run check:circular

      # Prettier (#254, step 1 — non-blocking). Reports formatting drift in
      # the log without failing the build; the repo-wide reformat is a
      # separate step-2 PR. Remove continue-on-error once the codebase is
      # formatted and the format-on-touch hook has caught up.
      - name: Prettier check (non-blocking)
        if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: bun run format:check
        continue-on-error: true

      # Stylelint (#257). Focused config: color-no-invalid-hex is a hard
      # error (clean baseline blocks new invalid hex); no-duplicate-selectors
      # / no-descending-specificity / declaration-no-important are warnings
      # (36 pre-existing, reported not blocked — drive to zero then promote).
      - name: Stylelint
        if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: bun run lint:css

      # Test Impact Analysis (#615): on a PR run only the Vitest files related
      # to files changed since the base branch (`--changed origin/<base>`).
      # Real test failures propagate (no masking). The ONLY fallback to the
      # full suite is an unresolvable base ref — a hard guard against a silent
      # skip. Push to develop/main always runs the full suite (the merge gate);
      # nightly + release run full too.
      - name: Run Vitest (selective on PR, full on push)
        if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            if git rev-parse --verify "$BASE" >/dev/null 2>&1; then
              echo "::notice::PR detected — Vitest --changed against $BASE"
              bunx vitest run --changed "$BASE"
            else
              echo "::warning::base ref $BASE unresolved — running FULL Vitest suite"
              bunx vitest run
            fi
          else
            echo "::notice::Push to ${{ github.ref_name }} — FULL Vitest suite"
            bunx vitest run
          fi

      - name: Build
        if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: bunx vite build

      # Dependency vulnerability scan (#224). --audit-level=high so
      # moderate/low advisories surface in the log without blocking the
      # build; a high/critical advisory fails CI for immediate triage.
      - name: npm audit (high+)
        if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: bun audit --audit-level=high

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run hooks on all files
        # SKIP the format-on-touch Prettier hook (#254): it --writes whatever
        # files it's given, and --all-files passes the whole tree — which
        # (step 1, ~90% unformatted) would reformat everything and fail. It's
        # a per-commit incremental hook, not an all-files gate; the
        # non-blocking `format:check` step in frontend-tests reports drift.
        # `eslint` is skipped too (#268): the hook runs `npx eslint src/`,
        # which needs frontend/node_modules — this job never runs `npm ci`,
        # so it would fail with `Cannot find package '@eslint/js'`. The
        # Frontend Tests job already runs ESLint with deps installed.
        env:
          SKIP: prettier-frontend,eslint
        run: pre-commit run --all-files --show-diff-on-failure

  lint-and-type-check:
    name: Backend ruff + mypy
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Reuse the same backend Poetry cache as the test job
      # (same key). Mypy needs the SQLAlchemy + Pydantic
      # stub-bearing venv that ``poetry install`` produces.
      - name: Cache Poetry virtualenv (backend)
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-backend-${{ runner.os }}-py3.12-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-backend-${{ runner.os }}-py3.12-
      - name: Install Poetry
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        run: pip install poetry
      - name: Install backend dependencies
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: poetry install --no-interaction --no-ansi
      - name: ruff check
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: poetry run ruff check app/
      - name: mypy
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: poetry run mypy app/
      # Dependency vulnerability scan (#224). pip-audit is a backend dev
      # dep; --skip-editable skips the local path-dep plugins (no PyPI
      # advisories). Audits the third-party dependency tree; a known
      # advisory fails CI for triage.
      #
      # #268 — pip-audit audits the whole venv, including the build
      # toolchain (pip/setuptools/wheel). Those get advisories on their own
      # cadence (e.g. pip 26.1.1 PYSEC-2026-196), which are not OUR deps and
      # are fixable by keeping the toolchain current — so upgrade it first.
      # A toolchain advisory with no fix yet can be parked with
      # `--ignore-vuln <ID>` (document the ID), never by dropping the gate.
      - name: pip-audit (backend deps)
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: |
          poetry run pip install --quiet --upgrade pip setuptools wheel
          poetry run pip-audit --skip-editable

  docs-verification:
    name: Docs drift verifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # verify_docs.py is stdlib-only; PyYAML is needed only for the
      # _meta.yaml <-> mkdocs.yml nav-sync check below.
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Verify documentation for drift
        run: python3 scripts/verify_docs.py
      - name: Verify mkdocs nav is in sync with _meta.yaml
        run: python3 scripts/generate_mkdocs_nav.py --check
      # #2075: a gate may not enforce a rule section that does not exist,
      # and a rule may not cite a workflow that is gone. Both directions.
      - name: Verify gate <-> rule links
        run: python3 scripts/verify_gate_rule_links.py
      # #2073: the themed lessons catalogue must stay complete - no section
      # silently lost in a reorganization.
      - name: Verify lessons inventory
        run: python3 scripts/verify_lessons_inventory.py --compare .claude/rules/lessons/.inventory-baseline.json
      # #2077: an inventoried check may not be silently unwired or degraded
      # into a no-op; turning one off requires a declared reason.
      - name: Verify check inventory
        run: python3 scripts/verify_check_inventory.py
      # #2091: the rule corpus is injected into every prompt, so its size is
      # paid on every turn. It may shrink; growing it is a deliberate act.
      - name: Verify rule corpus size
        run: python3 scripts/verify_rule_corpus_size.py
      # #2079: a binding rule may not change inside an undeclared diff.
      # Declare via the 'rule-change-declared' label or a
      # "RULE-CHANGE DECLARED: ..." line in the PR body.
      - name: Verify normative + gate-status changes are declared
        if: github.event_name == 'pull_request'
        env:
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'rule-change-declared') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch --no-tags --depth=200 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
          ARGS=(--base "origin/${{ github.base_ref }}" --pr-body "$PR_BODY")
          [ "$HAS_LABEL" = "true" ] && ARGS+=(--declared)
          python3 scripts/verify_normative_changes.py "${ARGS[@]}"
