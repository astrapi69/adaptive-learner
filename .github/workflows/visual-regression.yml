name: Visual regression

# Block 8 (#244) + critical-surfaces matrix (#705). Visual tests are SLOW
# and require a committed baseline, so they run as their own job — NOT in
# the smoke/PR gate (screenshots change on every UI PR; same night-shift
# rationale as the mutation / dexie-smoke workflows, #575). Runs nightly
# (04:00 UTC, after the nightly suite) + on demand via workflow_dispatch.
#
# NOT wired to pull_request on purpose. Manual-first per the "wired !=
# working" rule: trigger once after the baseline PNGs are committed and
# confirm green before relying on the schedule.

on:
  workflow_dispatch:
  schedule:
    # Nightly at 04:00 UTC — after the nightly test suite (#575).
    - cron: "0 4 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  visual:
    name: Visual screenshot matrix (themes + critical surfaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install frontend deps
        working-directory: frontend
        # --legacy-peer-deps: #266 eslint@10 vs eslint-plugin-react ^9.7 peer cap.
        run: npm ci --legacy-peer-deps

      - name: Build dexie frontend
        working-directory: frontend
        run: VITE_STORAGE_MODE=dexie npm run build

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run visual regression
        working-directory: e2e
        run: npx playwright test --config=playwright.visual.config.ts

      - name: Upload report + diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
