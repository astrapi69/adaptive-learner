name: Visual regression

# Block 8 (#244). Visual tests are SLOW and require a committed baseline,
# so they run as their own job — NOT in the smoke/PR gate. Manual-first
# (workflow_dispatch) per the "wired != working" rule: trigger once after
# the baseline PNGs are committed, confirm green, then enable the
# pull_request trigger below if desired.

on:
  workflow_dispatch:
  # Uncomment once e2e/visual/screenshots/ baselines are committed:
  # pull_request:
  #   paths:
  #     - "frontend/src/**"
  #     - "e2e/visual/**"
  #     - ".github/workflows/visual-regression.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  visual:
    name: Theme screenshot matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build dexie frontend
        working-directory: frontend
        run: VITE_STORAGE_MODE=dexie npm run build

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run visual regression
        working-directory: e2e
        run: npx playwright test --config=playwright.visual.config.ts

      - name: Upload report + diffs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-regression-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
