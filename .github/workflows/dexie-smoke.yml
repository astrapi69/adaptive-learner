name: Dexie smoke

# The primary integration gate for the GitHub-Pages-shape build (#301):
# every nav-reachable route against a VITE_STORAGE_MODE=dexie build with no
# backend. Runs on PRs that touch the frontend / e2e surface, plus manual
# dispatch. The make target builds the dexie frontend and runs the
# Playwright dexie config (preview-mode, no backend).

on:
  pull_request:
    paths:
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "e2e/**"
      - "Makefile"
      - ".github/workflows/dexie-smoke.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dexie-smoke:
    name: Dexie-mode E2E smoke
    runs-on: ubuntu-latest
    # 30 (was 20): headroom for a cold Playwright-browser cache. The smoke
    # run itself is ~6 min; the prior 20-min cap was blown by a slow browser
    # download in "Install Playwright browsers" before any test ran (#317).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install frontend deps
        working-directory: frontend
        # --legacy-peer-deps: #266 eslint@10 vs eslint-plugin-react ^9.7 peer cap.
        run: npm ci --legacy-peer-deps

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      # Cache the downloaded browser binaries so a slow Playwright CDN can't
      # time the job out (#317). Keyed on e2e/package-lock.json so the cache
      # invalidates when the @playwright/test version changes; on a miss the
      # install below downloads + the cache is saved for next time.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}

      # Cache MISS: download the browser (+ OS deps). The hang in #317 was the
      # ~150 MB Chrome-for-Testing zip from the Playwright CDN; ``--only-shell``
      # installs just the much smaller chromium-headless-shell, which is all
      # the headless dexie smoke run needs. Still kill a stuck attempt at 8 min
      # and retry up to 3x (inside the 30-min job budget); the first success
      # populates the cache so every later run takes the cache-hit path below.
      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: |
          for attempt in 1 2 3; do
            echo "::group::Playwright install (attempt $attempt)"
            if timeout 480 npx playwright install --with-deps --only-shell chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "attempt $attempt failed or timed out; retrying"
            echo "::endgroup::"
          done
          echo "Playwright browser install failed after 3 attempts"
          exit 1

      # Cache HIT: the browser binary is restored from cache, so NO CDN
      # download happens (no hang). Only the fast, no-download OS deps remain.
      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium

      # Builds the dexie frontend (VITE_STORAGE_MODE=dexie) and runs the
      # Playwright dexie config; both halves live in the make target so CI
      # and local stay in lock-step.
      - name: Dexie smoke
        run: make test-dexie-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dexie-smoke-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
