name: Dexie smoke

# The primary integration gate for the GitHub-Pages-shape build (#301):
# every nav-reachable route against a VITE_STORAGE_MODE=dexie build with no
# backend. Runs on PRs that touch the frontend / e2e surface, plus manual
# dispatch. The make target builds the dexie frontend and runs the
# Playwright dexie config (preview-mode, no backend).

on:
  pull_request:
    paths:
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "e2e/**"
      - "Makefile"
      - ".github/workflows/dexie-smoke.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dexie-smoke:
    name: Dexie-mode E2E smoke
    runs-on: ubuntu-latest
    # 30 (was 20): headroom for a cold Playwright-browser cache. The smoke
    # run itself is ~6 min; the prior 20-min cap was blown by a slow browser
    # download in "Install Playwright browsers" before any test ran (#317).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install frontend deps
        working-directory: frontend
        # --legacy-peer-deps: #266 eslint@10 vs eslint-plugin-react ^9.7 peer cap.
        run: npm ci --legacy-peer-deps

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      # Cache the downloaded browser binaries so a slow Playwright CDN can't
      # time the job out (#317). Keyed on e2e/package-lock.json so the cache
      # invalidates when the @playwright/test version changes; on a miss the
      # install below downloads + the cache is saved for next time.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: e2e
        # Idempotent: skips the download when the cache restored the binary,
        # still installs the (fast) OS deps via --with-deps.
        run: npx playwright install --with-deps chromium

      # Builds the dexie frontend (VITE_STORAGE_MODE=dexie) and runs the
      # Playwright dexie config; both halves live in the make target so CI
      # and local stay in lock-step.
      - name: Dexie smoke
        run: make test-dexie-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dexie-smoke-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
