name: Complexity Check

# Complexity ratchet gate (#400 Phase 1 warn-only -> #407 Phase 2 hard gate).
# Compares the current offenders (Python radon rank D/E/F = cc > 20; TypeScript
# eslint complexity > 20) to .complexity-baseline and FAILS the job on a new
# over-threshold file or a regression above a file's frozen worst-complexity.
# The baseline may only shrink - same ratchet contract as .filesize-baseline
# (#372). Refactor a file below its frozen value, then run
# `make check-complexity-gate-update`.

on:
  pull_request:
    paths:
      - "backend/app/**.py"
      - "plugins/**/*.py"
      - "frontend/src/**.ts"
      - "frontend/src/**.tsx"
      - ".complexity-baseline"
      - "scripts/check-complexity.sh"
      - "scripts/complexity_gate.py"
      - ".github/workflows/complexity-check.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  complexity-gate:
    name: Complexity ratchet gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Complexity ratchet gate
        # check-complexity.sh --gate bootstraps radon into an isolated venv,
        # runs eslint's complexity rule, and exits non-zero on a new/regressed
        # offender vs .complexity-baseline. No `|| true`: this is the hard gate.
        run: bash scripts/check-complexity.sh --gate
