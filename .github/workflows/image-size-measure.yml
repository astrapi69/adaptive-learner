name: Measure image size (report only)

# Takes the gzipped size of the app image for ONE architecture, on a native
# runner, and reports it (#2151). It never writes a baseline.
#
# Why it exists: #2147 keeps a ceiling per architecture and fails closed for
# an architecture that was never measured, so arm64 needs a number before the
# first publish. The dry run of publish-image.yml cannot supply it - a
# two-platform build with push:false produces a manifest that is not loadable
# into the local daemon, so there is nothing to measure.
#
# Why it does NOT write the baseline: entering a ceiling stays a deliberate
# act by a human who saw the number, the same separation the ratchets use
# (#2140 - offer, never apply). A workflow that measured AND entered would
# make the ceiling a side effect of running CI, and #2134 is the reminder of
# what a ceiling taken in the wrong place costs.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture to measure"
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - amd64

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  measure:
    name: Measure ${{ inputs.arch }}
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Confirm the runner is native for this architecture
        # A measurement taken under emulation is a different number than the
        # one users get (#2136 point 5), so this is asserted, not assumed.
        run: |
          set -euo pipefail
          want="${{ inputs.arch }}"
          case "$(uname -m)" in
            x86_64) have=amd64 ;;
            aarch64) have=arm64 ;;
            *) have="$(uname -m)" ;;
          esac
          echo "runner arch: $have (uname -m: $(uname -m)), requested: $want"
          if [ "$have" != "$want" ]; then
            echo "::error::not a native $want runner - refusing to report an emulated size"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Build this architecture only, into the local daemon
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/${{ inputs.arch }}
          load: true
          push: false
          tags: adaptive-learner:measure

      - name: Report the size, do not enter it
        run: |
          set -euo pipefail
          # Read-only on purpose: this file never enters a ceiling, it only
          # reports one. The test enforces that literally.
          python3 scripts/verify_image_size.py \
            --image adaptive-learner:measure --arch "${{ inputs.arch }}" \
            || true
          size=$(docker save adaptive-learner:measure | gzip -1 | wc -c)
          {
            echo "### Measured ${{ inputs.arch }}"
            echo ""
            echo "\`\`\`"
            echo "compressed (gzip -1): $size bytes ($((size / 1024 / 1024)) MB)"
            echo "runner: native $(uname -m)"
            echo "\`\`\`"
            echo ""
            echo "To enter it as the ceiling - a deliberate act, not a side effect:"
            echo ""
            echo "\`\`\`"
            echo "python3 scripts/verify_image_size.py --size-bytes $size \\"
            echo "  --arch ${{ inputs.arch }} --update-baseline"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "MEASURED ${{ inputs.arch }}: $size bytes"
